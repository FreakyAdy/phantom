name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  cpu-verification-gate:
    name: CPU CI Gate (${{ matrix.os }} - Py ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pytest fastapi uvicorn httpx structlog pillow rich pyyaml psutil
          pip install llama-cpp-python
          pip install -e python/

      - name: Run Numerical Reference Parity Gate (CPU)
        run: |
          python tests/correctness/test_reference_parity.py --quick
        env:
          PYTHONPATH: python

      - name: Run Quantitative Claims Consistency Gate
        run: |
          python scripts/check_claims.py

      - name: Verify RESULTS.md Sync with latest.json
        run: |
          python scripts/generate_results.py --check

      - name: Run Unit Tests
        run: |
          python -m pytest tests/unit/
        env:
          PYTHONPATH: python

  real-benchmark-gate:
    name: Real Benchmark Gate (ubuntu-latest - Py 3.11)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy pytest fastapi uvicorn httpx structlog pillow rich pyyaml psutil
          pip install llama-cpp-python
          pip install -e python/

      - name: Run Real Inference Benchmark (SmolLM-135M)
        run: |
          python benchmarks/run_real.py --n-iter 5
        env:
          PYTHONPATH: python
        timeout-minutes: 30

      - name: Upload Benchmark Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/latest.json
